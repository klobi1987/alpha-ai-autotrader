<!-- Settings View -->
<div x-show="currentView === 'settings'" x-cloak class="space-y-6">
    
    <!-- Message Alert -->
    <div x-show="message" 
         x-transition
         :class="{
             'bg-green-50 border-green-200 text-green-800 dark:bg-green-900/20 dark:border-green-800 dark:text-green-400': messageType === 'success',
             'bg-red-50 border-red-200 text-red-800 dark:bg-red-900/20 dark:border-red-800 dark:text-red-400': messageType === 'error',
             'bg-blue-50 border-blue-200 text-blue-800 dark:bg-blue-900/20 dark:border-blue-800 dark:text-blue-400': messageType === 'info'
         }"
         class="border rounded-lg p-4 flex items-center justify-between">
        <span x-text="message"></span>
        <button @click="message = null" class="ml-4 text-current opacity-70 hover:opacity-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    
    <!-- API Keys Section -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-lg font-semibold">API Keys</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                Configure your API keys for trading and data sources
            </p>
        </div>
        
        <div class="p-6 space-y-4">
            <template x-for="(keyData, keyName) in apiKeys" :key="keyName">
                <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4">
                    <!-- Key Header -->
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex-1">
                            <h3 class="font-medium" x-text="getKeyLabel(keyName)"></h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400" x-text="getKeyDescription(keyName)"></p>
                        </div>
                        <span class="px-2 py-1 text-xs font-medium rounded-full"
                              :class="getStatusColor(keyData.status)"
                              x-text="keyData.status.replace('_', ' ').toUpperCase()"></span>
                    </div>
                    
                    <!-- Edit Mode -->
                    <div x-show="editingKey === keyName" class="mt-4 space-y-3">
                        <div>
                            <label class="block text-sm font-medium mb-1">API Key</label>
                            <input type="password" 
                                   x-model="editingValue"
                                   @keyup.enter="saveAPIKey(keyName)"
                                   @keyup.escape="cancelEdit()"
                                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                   placeholder="Enter your API key">
                        </div>
                        <div class="flex space-x-2">
                            <button @click="saveAPIKey(keyName)" 
                                    :disabled="saving"
                                    class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2">
                                <svg x-show="saving" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <span x-text="saving ? 'Saving...' : 'Save'"></span>
                            </button>
                            <button @click="cancelEdit()" 
                                    class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600">
                                Cancel
                            </button>
                        </div>
                    </div>
                    
                    <!-- View Mode -->
                    <div x-show="editingKey !== keyName" class="mt-4">
                        <div x-show="keyData.is_set" class="flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <code class="px-3 py-1 bg-gray-100 dark:bg-gray-700 rounded text-sm font-mono" 
                                      x-text="keyData.masked_value || '••••••••'"></code>
                                <span class="text-xs text-green-600 dark:text-green-400">✓ Set</span>
                            </div>
                            <div class="flex space-x-2">
                                <button @click="testConnection(keyName)"
                                        :disabled="testing"
                                        class="px-3 py-1 text-sm bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 rounded hover:bg-blue-200 dark:hover:bg-blue-900/50 disabled:opacity-50">
                                    <span x-text="testing ? 'Testing...' : 'Test'"></span>
                                </button>
                                <button @click="startEditKey(keyName)"
                                        class="px-3 py-1 text-sm bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded hover:bg-gray-200 dark:hover:bg-gray-600">
                                    Update
                                </button>
                                <button @click="deleteAPIKey(keyName)"
                                        class="px-3 py-1 text-sm bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 rounded hover:bg-red-200 dark:hover:bg-red-900/50">
                                    Delete
                                </button>
                            </div>
                        </div>
                        
                        <div x-show="!keyData.is_set">
                            <button @click="startEditKey(keyName)"
                                    class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 flex items-center space-x-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                                <span>Add API Key</span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
    
    <!-- Trading Settings Section -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-lg font-semibold">Trading Configuration</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                Configure trading parameters and risk management
            </p>
        </div>
        
        <div class="p-6 space-y-6">
            <!-- Trading Mode -->
            <div>
                <label class="block text-sm font-medium mb-2">Trading Mode</label>
                <div class="flex space-x-4">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" 
                               x-model="tradingSettings.trading_mode" 
                               value="testing"
                               class="text-purple-600 focus:ring-purple-500">
                        <span>Testing (Paper Trading)</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" 
                               x-model="tradingSettings.trading_mode" 
                               value="live"
                               class="text-purple-600 focus:ring-purple-500">
                        <span>Live Trading</span>
                    </label>
                </div>
            </div>
            
            <!-- Auto Trading -->
            <div class="flex items-center justify-between">
                <div>
                    <label class="block text-sm font-medium">Auto Trading</label>
                    <p class="text-sm text-gray-500 dark:text-gray-400">Enable autonomous trading</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" 
                           x-model="tradingSettings.auto_trading_enabled" 
                           class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 dark:peer-focus:ring-purple-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-purple-600"></div>
                </label>
            </div>
            
            <!-- Risk Settings -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Max Position Size ($)</label>
                    <input type="number" 
                           x-model.number="tradingSettings.max_position_size"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">Max Leverage</label>
                    <input type="number" 
                           x-model.number="tradingSettings.max_leverage"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">Max Concurrent Positions</label>
                    <input type="number" 
                           x-model.number="tradingSettings.max_concurrent_positions"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">Default Stop Loss (%)</label>
                    <input type="number" 
                           step="0.1"
                           x-model.number="tradingSettings.stop_loss_default"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">Min Confidence Score</label>
                    <input type="number" 
                           step="0.1"
                           min="0"
                           max="10"
                           x-model.number="tradingSettings.min_confidence"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
            </div>
            
            <!-- Trading Options -->
            <div class="space-y-3">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" 
                           x-model="tradingSettings.enable_spot_trading"
                           class="rounded text-purple-600 focus:ring-purple-500">
                    <span class="text-sm">Enable Spot Trading</span>
                </label>
                
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" 
                           x-model="tradingSettings.enable_futures_trading"
                           class="rounded text-purple-600 focus:ring-purple-500">
                    <span class="text-sm">Enable Futures Trading</span>
                </label>
                
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" 
                           x-model="tradingSettings.auto_compound_profits"
                           class="rounded text-purple-600 focus:ring-purple-500">
                    <span class="text-sm">Auto-Compound Profits</span>
                </label>
            </div>
            
            <!-- Save Button -->
            <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
                <button @click="saveTradingSettings()" 
                        :disabled="saving"
                        class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2">
                    <svg x-show="saving" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="saving ? 'Saving...' : 'Save Trading Settings'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
